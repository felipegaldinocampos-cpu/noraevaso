    <script>
    // ================================================================
    // CREDENCIAIS DO SUPABASE

    const SUPABASE_URL = 'https://aueniphfvgsweusjycyb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1ZW5pcGhmdmdzd2V1c2p5Y3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3ODIxMjMsImV4cCI6MjA5MzM1ODEyM30.OAgMpcVk63gVjVXNEbQvR4tFns1mcqrTNEYXYilNpes';
    // ================================================================

    let db = null;
    let currentUser = null;
    let currentRole = null;
    let currentProfile = null;
    let currentPage = 'topicos'; // página ativa (qualquer das duas seções)

    let logFilters = { dateFrom: '', dateTo: '', userQuery: '', actionType: '' };
    let logPage = 1;
    const LOGS_PER_PAGE = 25;
    const CONTENT_BUCKET = 'learning-content';
    const LEARNING_TOPICS = [
        { slug: 'neurologico', label: 'Neurológico', description: 'Neurologia intensiva, sedação, delirium, AVC, convulsões e coma.' },
        { slug: 'hemodinamica', label: 'Hemodinâmica', description: 'Choque, drogas vasoativas, monitorização, reposição volêmica e perfusão.' },
        { slug: 'respiratorio', label: 'Respiratório', description: 'Ventilação mecânica, insuficiência respiratória, SDRA e desmame.' },
        { slug: 'abdominal', label: 'Abdominal', description: 'Sepse abdominal, pancreatite, fígado, nutrição e abdome agudo no CTI.' },
        { slug: 'renal', label: 'Renal', description: 'Lesão renal aguda, distúrbios eletrolíticos, diálise e balanço hídrico.' },
        { slug: 'profilaxias', label: 'Profilaxias', description: 'Trombose, úlcera de estresse, prevenção de infecção e bundles assistenciais.' },
        { slug: 'dispositivos', label: 'Dispositivos', description: 'Cateteres, drenos, sondas, acessos, monitores e cuidados relacionados.' },
        { slug: 'procedimentos', label: 'Procedimentos', description: 'Passo a passo, indicações, contraindicações e segurança à beira-leito.' },
        { slug: 'miscelanea', label: 'Miscelânea', description: 'Temas transversais e conteúdos complementares de terapia intensiva.' }
    ];
    const CONTENT_TYPES = [
        { value: 'video', label: 'Aula gravada' },
        { value: 'pdf', label: 'PDF' },
        { value: 'slide', label: 'Slides' },
        { value: 'audio', label: 'Áudio' },
        { value: 'link', label: 'Material complementar' }
    ];
    let selectedTopicSlug = null;
    let contentAdminFilter = 'all';

    if (window.supabase) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // ============= UTILS =============
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    function getDeviceInfo() {
        const ua = navigator.userAgent;
        const w = window.screen.width;
        const h = window.screen.height;
        let icon = '🖥️', os = 'Web';
        if (/iPhone|iPad|iPod/i.test(ua)) { icon = '📱'; os = 'iOS'; }
        else if (/Android/i.test(ua)) { icon = '📱'; os = 'Android'; }
        else if (/Macintosh|Mac OS/i.test(ua)) { icon = '💻'; os = 'Mac'; }
        else if (/Windows/i.test(ua)) { icon = '🖥️'; os = 'Win'; }
        else if (/Linux/i.test(ua)) { icon = '🖥️'; os = 'Linux'; }
        return `${icon} ${os} ${w}x${h}`;
    }

    function formatDateTime(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        return `${d.toLocaleDateString('pt-BR')}, ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    }

    async function logAction(action, details) {
        if (!currentUser || !db) return;
        try {
            await db.from('admin_logs').insert([{
                admin_id: currentUser.id,
                action: action,
                details: details || {},
                device: getDeviceInfo(),
                user_email: currentUser.email,
                user_name: (currentProfile && currentProfile.full_name) || currentUser.email
            }]);
        } catch (err) {
            console.warn('Falha ao registrar log:', err);
        }
    }

    function getActionBadge(action) {
        const map = {
            'Login': 'badge-success', 'Logout': 'badge-default', 'Cadastro': 'badge-info',
            'Acesso Tópico': 'badge-info', 'Criar Anotação': 'badge-success',
            'Editar Perfil': 'badge-warning', 'Acesso Admin': 'badge-warning',
            'Upload Conteúdo': 'badge-success', 'Excluir Conteúdo': 'badge-danger',
            'Publicar Conteúdo': 'badge-success', 'Despublicar Conteúdo': 'badge-warning',
            'Abrir Material': 'badge-info'
        };
        return map[action] || 'badge-default';
    }

    function isAdmin() {
        return currentRole === 'admin';
    }

    function getTopic(topicSlug) {
        return LEARNING_TOPICS.find(t => t.slug === topicSlug) || null;
    }

    function getTopicLabel(topicSlug) {
        const topic = getTopic(topicSlug);
        return topic ? topic.label : topicSlug;
    }

    function getContentTypeLabel(type) {
        const item = CONTENT_TYPES.find(t => t.value === type);
        return item ? item.label : (type || 'Material');
    }

    function formatFileSize(bytes) {
        if (!bytes && bytes !== 0) return 'Tamanho não informado';
        const units = ['B', 'KB', 'MB', 'GB'];
        let size = Number(bytes);
        let unitIndex = 0;
        while (size >= 1024 && unitIndex < units.length - 1) {
            size = size / 1024;
            unitIndex++;
        }
        return `${size.toFixed(size >= 10 || unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
    }

    function sanitizeFileName(fileName) {
        const clean = (fileName || 'arquivo')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-zA-Z0-9._-]+/g, '-')
            .replace(/^-+|-+$/g, '')
            .toLowerCase();
        return clean || `material-${Date.now()}`;
    }

    function isMissingContentSchema(error) {
        if (!error) return false;
        const msg = `${error.message || ''} ${error.details || ''} ${error.hint || ''}`;
        return /learning_materials|learning-content|schema cache|does not exist|bucket/i.test(msg);
    }

    function renderContentSetupNotice(error) {
        const detail = error && error.message ? `<br><span class="muted">Detalhe técnico: ${escapeHtml(error.message)}</span>` : '';
        return `
            <div class="info-box schema-box">
                <h3>Estrutura do Supabase pendente</h3>
                <p>Para ativar uploads, execute o arquivo <code>SUPABASE_CONTEUDO.sql</code> no SQL Editor do Supabase. Ele cria a tabela <code>learning_materials</code>, o bucket privado <code>${CONTENT_BUCKET}</code> e as políticas de segurança.${detail}</p>
            </div>
        `;
    }

    async function fetchLearningMaterials(options) {
        const cfg = options || {};
        let query = db.from('learning_materials').select('*').order('created_at', { ascending: false });
        if (cfg.topic) query = query.eq('topic', cfg.topic);
        if (cfg.publishedOnly) query = query.eq('is_published', true);
        const result = await query;
        if (result.error) throw result.error;
        return result.data || [];
    }

    function countMaterialsByTopic(materials) {
        const counts = {};
        LEARNING_TOPICS.forEach(t => counts[t.slug] = 0);
        (materials || []).forEach(m => {
            if (counts[m.topic] !== undefined) counts[m.topic]++;
        });
        return counts;
    }

    async function getMaterialUrl(material) {
        if (!material || !material.file_path) return null;
        const signed = await db.storage.from(CONTENT_BUCKET).createSignedUrl(material.file_path, 60 * 60);
        if (!signed.error && signed.data && signed.data.signedUrl) return signed.data.signedUrl;
        const publicUrl = db.storage.from(CONTENT_BUCKET).getPublicUrl(material.file_path);
        return publicUrl && publicUrl.data ? publicUrl.data.publicUrl : null;
    }

    async function openMaterial(materialId) {
        try {
            const result = await db.from('learning_materials').select('*').eq('id', materialId).single();
            if (result.error) throw result.error;
            const url = await getMaterialUrl(result.data);
            if (!url) throw new Error('Não foi possível gerar o link do arquivo.');
            await logAction('Abrir Material', {
                material_id: materialId,
                title: result.data.title,
                topic: result.data.topic
            });
            window.open(url, '_blank', 'noopener');
        } catch (err) {
            alert('Erro ao abrir material: ' + err.message);
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'Entrando...';

        try {
            const result = await db.auth.signInWithPassword({ email, password });
            if (result.error) throw result.error;

            currentUser = result.data.user;
            const profileResult = await db.from('profiles').select('*').eq('id', currentUser.id).single();
            currentProfile = profileResult.data;
            currentRole = (currentProfile && currentProfile.role) ? currentProfile.role : 'user';

            await logAction('Login', { method: 'email/password' });
            currentPage = 'topicos';
            renderShell();
        } catch (err) {
            renderLogin('❌ ' + err.message);
        }
    }

    async function handleSignup(e) {
        e.preventDefault();
        const fullName = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const btn = document.getElementById('signupBtn');
        btn.disabled = true;
        btn.textContent = 'Criando conta...';

        try {
            const result = await db.auth.signUp({
                email, password,
                options: { data: { full_name: fullName } }
            });
            if (result.error) throw result.error;
            renderSignup('✅ Conta criada! Verifique seu email para confirmar e depois faça login.');
        } catch (err) {
            renderSignup('❌ ' + err.message);
        }
    }

    async function handleLogout() {
        await logAction('Logout', {});
        await db.auth.signOut();
        currentUser = null;
        currentRole = null;
        currentProfile = null;
        renderLogin();
    }

    function renderSidebar() {
        const items = [];

        // Seção do USUÁRIO (todos veem)
        items.push({ section: 'Plataforma' });
        items.push({ id: 'topicos', icon: '📚', label: 'Tópicos' });
        items.push({ id: 'anotacoes', icon: '📝', label: 'Minhas anotações' });

        // Seção ADMIN (só admin vê)
        if (isAdmin()) {
            items.push({ section: 'Admin · Análise', isAdmin: true });
            items.push({ id: 'analise', icon: '📊', label: 'Dashboard', isAdmin: true });
            items.push({ id: 'logs', icon: '🔍', label: 'Log de Auditoria', isAdmin: true });
            items.push({ section: 'Admin · Gestão', isAdmin: true });
            items.push({ id: 'usuarios', icon: '👥', label: 'Usuários', isAdmin: true });
            items.push({ id: 'admin-anotacoes', icon: '📑', label: 'Todas anotações', isAdmin: true });

            items.push({ id: 'config', icon: '⚙️', label: 'Configurações', isAdmin: true });
            items.push({ id: 'seguranca', icon: '🔐', label: 'Segurança', isAdmin: true });
        }

        let html = '';
        items.forEach(it => {
            if (it.section) {
                const cls = it.isAdmin ? 'sidebar-section admin-section' : 'sidebar-section';
                html += `<div class="${cls}">${it.section}</div>`;
            } else {
                const active = currentPage === it.id ? 'active' : '';
                const adminCls = it.isAdmin ? 'admin-link' : '';
                html += `<button class="sidebar-link ${adminCls} ${active}" onclick="changePage('${it.id}')">
                    <span class="sidebar-icon">${it.icon}</span> ${it.label}
                </button>`;
            }
        });
        html += `<div style="flex:1"></div>`;
        html += `<div class="sidebar-section">Conta</div>`;
        html += `<button class="sidebar-link" onclick="handleLogout()"><span class="sidebar-icon">🚪</span> Sair</button>`;
        document.getElementById('sidebar').innerHTML = html;
    }

    function changePage(page) {
        currentPage = page;
        logPage = 1;
        renderShell();
    }

    async function renderPage() {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="empty-state">Carregando...</div>';

        // Páginas do usuário
        if (currentPage === 'topicos') await renderTopicos(content);
        else if (currentPage === 'topico') await renderTopicMaterials(content);
        else if (currentPage === 'anotacoes') await renderMinhasAnotacoes(content);
        // Páginas do admin
        else if (currentPage === 'analise') await renderAnalise(content);
        else if (currentPage === 'logs') await renderLogs(content);
        else if (currentPage === 'usuarios') await renderUsuarios(content);
        else if (currentPage === 'admin-anotacoes') await renderTodasAnotacoes(content);
        else if (currentPage === 'conteudo') await renderConteudo(content);
        else if (currentPage === 'config') await renderConfig(content);
        else if (currentPage === 'seguranca') await renderSeguranca(content);
    }

    // ============= ADMIN: LOGS =============
    async function renderLogs(content) {
        await logAction('Acesso Admin', { page: 'logs' });

        let query = db.from('admin_logs').select('*', { count: 'exact' });

        if (logFilters.dateFrom) query = query.gte('created_at', logFilters.dateFrom + 'T00:00:00');
        if (logFilters.dateTo) query = query.lte('created_at', logFilters.dateTo + 'T23:59:59');
        if (logFilters.actionType) query = query.eq('action', logFilters.actionType);
        if (logFilters.userQuery) query = query.or(`user_name.ilike.%${logFilters.userQuery}%,user_email.ilike.%${logFilters.userQuery}%`);

        const from = (logPage - 1) * LOGS_PER_PAGE;
        const to = from + LOGS_PER_PAGE - 1;

        const result = await query.order('created_at', { ascending: false }).range(from, to);
        const logs = result.data || [];
        const total = result.count || 0;
        const totalPages = Math.max(1, Math.ceil(total / LOGS_PER_PAGE));

        const logsHtml = logs.map(l => {
            let detailStr = '';
            if (l.details && typeof l.details === 'object') {
                const entries = Object.entries(l.details);
                detailStr = entries.map(([k, v]) => `<strong>${escapeHtml(k)}:</strong> ${escapeHtml(v)}`).join(' · ');
            }
            return `
                <tr>
                    <td class="td-time">${formatDateTime(l.created_at)}</td>
                    <td class="td-user">${escapeHtml(l.user_name || l.user_email || '—')}</td>
                    <td><span class="badge ${getActionBadge(l.action)}">${escapeHtml(l.action)}</span></td>
                    <td class="td-detail">${detailStr || '—'}</td>
                    <td class="td-device">${escapeHtml(l.device || '—')}</td>
                </tr>
            `;
        }).join('');

        content.innerHTML = `
            <div class="page-header">
                <h1 class="page-title">🔍 Log de Auditoria</h1>
                <p class="page-subtitle">Registro de acessos e ações realizadas no sistema</p>
            </div>

            <div class="filters-bar">
                <div class="filter-group">
                    <label>De</label>
                    <input type="date" id="filterDateFrom" value="${logFilters.dateFrom}">
                </div>
                <div class="filter-group">
                    <label>Até</label>
                    <input type="date" id="filterDateTo" value="${logFilters.dateTo}">
                </div>
                <div class="filter-group">
                    <label>Usuário</label>
                    <input type="text" id="filterUser" placeholder="Nome ou email" value="${logFilters.userQuery}">
                </div>
                <div class="filter-group">
                    <label>Ação</label>
                    <select id="filterAction">
                        <option value="">Todas</option>
                        <option ${logFilters.actionType === 'Login' ? 'selected' : ''}>Login</option>
                        <option ${logFilters.actionType === 'Logout' ? 'selected' : ''}>Logout</option>
                        <option ${logFilters.actionType === 'Cadastro' ? 'selected' : ''}>Cadastro</option>
                        <option ${logFilters.actionType === 'Acesso Tópico' ? 'selected' : ''}>Acesso Tópico</option>
                        <option ${logFilters.actionType === 'Criar Anotação' ? 'selected' : ''}>Criar Anotação</option>
                        <option ${logFilters.actionType === 'Editar Perfil' ? 'selected' : ''}>Editar Perfil</option>
                        <option ${logFilters.actionType === 'Acesso Admin' ? 'selected' : ''}>Acesso Admin</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="applyLogFilters()">Filtrar</button>
                    <button class="btn btn-secondary" onclick="clearLogFilters()">Limpar</button>
                </div>
            </div>

            <div class="table-wrap">
                <div class="table-header">
                    <div class="table-header-info">
                        <span class="live-dot"></span>
                        <span>ao vivo · <strong>${total}</strong> ${total === 1 ? 'registro' : 'registros'}</span>
                    </div>
                    <button class="btn btn-secondary" onclick="renderPage()">↺ Atualizar</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th style="width:160px">Data/Hora</th>
                            <th style="width:160px">Usuário</th>
                            <th style="width:130px">Ação</th>
                            <th>Detalhe</th>
                            <th style="width:140px">Dispositivo</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${logsHtml || '<tr><td colspan="5" class="empty-state">Nenhum registro encontrado</td></tr>'}
                    </tbody>
                </table>
                <div class="pagination">
                    <span>Página <strong>${logPage}</strong> de <strong>${totalPages}</strong></span>
                    <div class="pagination-controls">
                        <button onclick="changeLogPage(${logPage - 1})" ${logPage <= 1 ? 'disabled' : ''}>← Anterior</button>
                        <button onclick="changeLogPage(${logPage + 1})" ${logPage >= totalPages ? 'disabled' : ''}>Próxima →</button>
                    </div>
                </div>
            </div>
        `;
    }

        logFilters.dateFrom = document.getElementById('filterDateFrom').value;
        logFilters.dateTo = document.getElementById('filterDateTo').value;
        logFilters.userQuery = document.getElementById('filterUser').value;
        logFilters.actionType = document.getElementById('filterAction').value;

    function setContentAdminFilter(topicSlug) {
        contentAdminFilter = topicSlug;

    async function handleContentUpload(e) {
        e.preventDefault();
        if (!isAdmin()) {
            alert('Apenas administradores podem enviar conteúdo.');
            return;
        }

        const btn = document.getElementById('uploadContentBtn');
        const status = document.getElementById('uploadStatus');
        const fileInput = document.getElementById('contentFile');
        const file = fileInput.files && fileInput.files[0];

        if (!file) {
            alert('Selecione um arquivo para enviar.');
            return;
        }

        const topic = document.getElementById('contentTopic').value;
        const title = document.getElementById('contentTitle').value.trim();
        const description = document.getElementById('contentDescription').value.trim();
        const contentType = document.getElementById('contentType').value;
        const isPublished = document.getElementById('contentPublished').checked;
        const filePath = `${topic}/${Date.now()}-${sanitizeFileName(file.name)}`;

        btn.disabled = true;
        btn.textContent = 'Enviando...';
        status.textContent = 'Enviando arquivo para o Supabase Storage...';

        try {
            const upload = await db.storage.from(CONTENT_BUCKET).upload(filePath, file, {
                cacheControl: '3600',
                upsert: false,
                contentType: file.type || undefined
            });
            if (upload.error) throw upload.error;

            status.textContent = 'Salvando cadastro do material...';
            const insert = await db.from('learning_materials').insert([{
                topic: topic,
                title: title,
                description: description,
                content_type: contentType,
                file_path: filePath,
                file_name: file.name,
                file_size: file.size,
                mime_type: file.type,
                is_published: isPublished,
                created_by: currentUser.id
            }]);

            if (insert.error) {
                await db.storage.from(CONTENT_BUCKET).remove([filePath]);
                throw insert.error;
            }

            await logAction('Upload Conteúdo', {
                title: title,
                topic: topic,
                type: contentType,
                file_name: file.name,
                file_size: file.size,
                published: isPublished
            });

            status.textContent = 'Material enviado com sucesso.';
            e.target.reset();
            renderPage();
        } catch (err) {
            status.textContent = '';
            alert('Erro ao enviar material: ' + err.message);
            btn.disabled = false;
            btn.textContent = 'Enviar material';
        }
    }

    async function toggleMaterialPublish(materialId, publish) {
        try {
            const result = await db.from('learning_materials')
                .update({ is_published: publish, updated_at: new Date().toISOString() })
                .eq('id', materialId);
            if (result.error) throw result.error;
            await logAction(publish ? 'Publicar Conteúdo' : 'Despublicar Conteúdo', { material_id: materialId });
            renderPage();
        } catch (err) {
            alert('Erro ao alterar status: ' + err.message);
        }
    }

    async function deleteMaterial(materialId) {
        if (!confirm('Excluir este material? O arquivo também será removido do Supabase Storage.')) return;

        try {
            const found = await db.from('learning_materials').select('*').eq('id', materialId).single();
            if (found.error) throw found.error;
            const material = found.data;

            if (material.file_path) {
                const removed = await db.storage.from(CONTENT_BUCKET).remove([material.file_path]);
                if (removed.error) throw removed.error;
            }

            const deleted = await db.from('learning_materials').delete().eq('id', materialId);
            if (deleted.error) throw deleted.error;

            await logAction('Excluir Conteúdo', {
                material_id: materialId,
                title: material.title,
                topic: material.topic
            });
            renderPage();
        } catch (err) {
            alert('Erro ao excluir material: ' + err.message);
        }
    }

    // ============= INIT =============
    async function init() {
        if (!db) {
            document.getElementById('app').innerHTML = `
                <div class="auth-container">
                    <div class="alert alert-error">
                        ❌ Erro ao carregar a biblioteca Supabase. Verifique sua conexão com a internet.
                    </div>
                </div>
            `;
            return;
        }

        try {
            const sessionResult = await db.auth.getSession();
            const session = sessionResult.data.session;

            if (session && session.user) {
                currentUser = session.user;
                const profileResult = await db.from('profiles').select('*').eq('id', session.user.id).single();
                currentProfile = profileResult.data;
                currentRole = (currentProfile && currentProfile.role) ? currentProfile.role : 'user';
                currentPage = 'topicos';
                renderShell();
            } else {
                renderLogin();
            }
        } catch (err) {
            console.error('Erro:', err);
            renderLogin();
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
