<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nora e Vaso — Curso de Paciente Grave</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Sora', sans-serif; background: #fff; color: #2C2C2A; font-size: 14px; line-height: 1.5; }

        /* ============ LANDING PAGE ============ */
        .landing { background: #fff; min-height: 100vh; }

        .landing-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.25rem 2rem; max-width: 1200px; margin: 0 auto;
            border-bottom: 1px solid #f0f0f0;
        }
        .logo {
            display: flex; align-items: center; gap: 10px;
            font-weight: 700; font-size: 18px; color: #042C53;
        }
        .logo-mark {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #185FA5 0%, #042C53 100%);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 16px;
            box-shadow: 0 2px 6px rgba(24, 95, 165, 0.25);
        }
        .nav-actions { display: flex; gap: 12px; align-items: center; }
        .nav-link {
            color: #555; font-size: 13px; text-decoration: none;
            background: none; border: none; cursor: pointer; font-family: inherit;
        }
        .nav-link:hover { color: #185FA5; }

        .btn-cta {
            background: #185FA5; color: white; padding: 10px 20px;
            border-radius: 6px; border: none; font-weight: 600; font-size: 13px;
            cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .btn-cta:hover { background: #0C447C; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(24, 95, 165, 0.3); }
        .btn-cta-large { padding: 14px 32px; font-size: 15px; }

        /* HERO */
        .hero {
            max-width: 1200px; margin: 0 auto; padding: 4rem 2rem;
            display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center;
        }
        .hero-eyebrow {
            display: inline-block; padding: 4px 12px; background: #E6F1FB;
            color: #185FA5; border-radius: 100px; font-size: 11px;
            font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
            margin-bottom: 1.25rem;
        }
        .hero-title {
            font-family: 'DM Serif Display', serif; font-size: 48px;
            line-height: 1.1; color: #042C53; margin-bottom: 1.25rem; font-weight: 400;
        }
        .hero-title em { font-style: italic; color: #185FA5; }
        .hero-subtitle {
            font-size: 17px; color: #555; line-height: 1.6;
            margin-bottom: 1.75rem; max-width: 540px;
        }

        .hero-bullets { list-style: none; margin-bottom: 2rem; }
        .hero-bullets li {
            padding: 6px 0; font-size: 14px; color: #333;
            display: flex; align-items: start; gap: 10px;
        }
        .check-icon {
            width: 20px; height: 20px; background: #E6F1FB; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            color: #185FA5; font-weight: 700; font-size: 12px; flex-shrink: 0;
        }

        .hero-cta-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .hero-meta {
            font-size: 12px; color: #888; margin-top: 1rem;
            display: flex; align-items: center; gap: 6px;
        }

        /* VIDEO FRAME */
        .video-wrap {
            position: relative; padding-bottom: 56.25%; height: 0;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 12px 40px rgba(4, 44, 83, 0.15);
            background: #042C53;
        }
        .video-wrap iframe {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border: 0;
        }
        .video-placeholder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 12px;
            background: linear-gradient(135deg, #042C53 0%, #185FA5 100%);
            color: white; text-align: center; padding: 2rem;
        }
        .play-icon {
            width: 64px; height: 64px; background: rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; backdrop-filter: blur(10px);
        }

        /* CREDENCIAIS */
        .creds-section {
            background: #f9fafb; padding: 3rem 2rem; border-top: 1px solid #f0f0f0;
        }
        .creds-inner { max-width: 1100px; margin: 0 auto; }
        .creds-title {
            text-align: center; font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.1em; color: #888; font-weight: 600; margin-bottom: 1.25rem;
        }
        .creds-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem; max-width: 1000px; margin: 0 auto;
        }
        .cred-item {
            background: white; padding: 1rem 1.25rem; border-radius: 8px;
            border: 1px solid #e5e5e5; text-align: center;
        }
        .cred-item-title { font-size: 13px; font-weight: 600; color: #042C53; margin-bottom: 2px; }
        .cred-item-meta { font-size: 11px; color: #888; }

        /* SOBRE */
        .about-section {
            max-width: 1100px; margin: 0 auto; padding: 4rem 2rem;
            display: grid; grid-template-columns: 1fr 2fr; gap: 3rem;
        }
        .about-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
            color: #888; font-weight: 600; margin-bottom: 0.75rem;
        }
        .about-name {
            font-family: 'DM Serif Display', serif; font-size: 30px;
            color: #042C53; line-height: 1.15; margin-bottom: 0.5rem;
        }
        .about-role { color: #185FA5; font-size: 14px; font-weight: 600; }
        .about-text { font-size: 15px; color: #444; line-height: 1.75; }
        .about-text p { margin-bottom: 1rem; }

        /* TÓPICOS */
        .topics-section {
            background: #fafbfc; padding: 4rem 2rem;
            border-top: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0;
        }
        .section-inner { max-width: 1100px; margin: 0 auto; }
        .section-title {
            font-family: 'DM Serif Display', serif; font-size: 32px;
            color: #042C53; text-align: center; margin-bottom: 0.5rem;
        }
        .section-subtitle {
            text-align: center; color: #666; font-size: 15px; margin-bottom: 2.5rem;
        }
        .topics-preview-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }
        .topic-preview {
            background: white; padding: 1.5rem 1.25rem; border-radius: 10px;
            border: 1px solid #e5e5e5; text-align: center; transition: all 0.2s;
        }
        .topic-preview:hover { border-color: #185FA5; box-shadow: 0 6px 20px rgba(24, 95, 165, 0.1); transform: translateY(-2px); }
        .topic-preview-emoji { font-size: 36px; margin-bottom: 0.5rem; }
        .topic-preview-name { font-size: 14px; font-weight: 600; color: #042C53; }

        /* FINAL CTA */
        .final-cta {
            background: linear-gradient(135deg, #042C53 0%, #185FA5 100%);
            padding: 4rem 2rem; text-align: center; color: white;
        }
        .final-cta h2 {
            font-family: 'DM Serif Display', serif; font-size: 36px;
            margin-bottom: 1rem; max-width: 700px; margin-left: auto; margin-right: auto;
        }
        .final-cta p {
            font-size: 16px; margin-bottom: 2rem; opacity: 0.9;
            max-width: 600px; margin-left: auto; margin-right: auto;
        }
        .btn-cta-white {
            background: white; color: #042C53; padding: 14px 32px;
            border-radius: 6px; border: none; font-weight: 700; font-size: 15px;
            cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .btn-cta-white:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }

        /* FOOTER */
        .footer {
            padding: 2rem; text-align: center; color: #888; font-size: 12px;
            border-top: 1px solid #f0f0f0;
        }
        .footer-cremesp { font-family: monospace; }

        /* ============ AUTH ============ */
        .auth-container { max-width: 420px; margin: 4rem auto; padding: 0 1rem; }
        .auth-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #e5e5e5; }
        .auth-title { font-size: 28px; margin-bottom: 0.5rem; color: #042C53; }
        .auth-subtitle { color: #666; margin-bottom: 2rem; font-size: 14px; }
        .auth-back {
            display: inline-block; margin-bottom: 1rem; color: #888;
            font-size: 12px; cursor: pointer; background: none; border: none; font-family: inherit;
        }
        .auth-back:hover { color: #185FA5; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 4px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 9px 12px; border: 1px solid #ddd;
            border-radius: 4px; font-size: 14px; font-family: inherit; background: white;

            outline: none; border-color: #185FA5; box-shadow: 0 0 0 2px rgba(24, 95, 165, 0.1);

        .btn { padding: 9px 14px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
        .btn-primary { background: #185FA5; color: white; }
        .btn-primary:hover { background: #0C447C; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-block { width: 100%; margin-top: 1rem; }
        .btn-link { background: none; border: none; color: #185FA5; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-secondary { background: white; border: 1px solid #ddd; color: #333; }
        .btn-secondary:hover { background: #f5f5f5; }
        .btn-danger { background: #c62828; color: white; }
        .btn-danger:hover { background: #a01919; }

        .alert { padding: 10px; margin-bottom: 1rem; border-radius: 4px; font-size: 13px; }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; }
        .alert-error { background: #ffebee; color: #c62828; border: 1px solid #f44336; }

        .divider { text-align: center; margin: 1.5rem 0; font-size: 13px; color: #666; }

        /* ============ APP SHELL ============ */
        .app-shell { display: flex; min-height: 100vh; }

        .top-bar {
            background: white; padding: 0.75rem 1.5rem; display: flex;

        .top-bar-title { font-weight: 600; color: #042C53; font-size: 15px; }
        .top-bar-badge {

            color: white; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
        }
        .top-bar-badge.admin { background: #042C53; }
        .top-bar-right { display: flex; align-items: center; gap: 0.75rem; }
        .top-bar-user { font-size: 12px; color: #666; }
        .top-bar-user strong { color: #042C53; }
        .role-pill {
            display: inline-block; padding: 2px 8px; background: #fff3cd;
            color: #856404; border-radius: 3px; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em; margin-left: 4px;
        }

        .sidebar {
            width: 220px; background: white; border-right: 1px solid #e5e5e5;
            padding: 1rem 0; display: flex; flex-direction: column; flex-shrink: 0;
        }
        .sidebar-logo {
            display: flex; align-items: center; gap: 8px;
            padding: 0 1.25rem 1rem; border-bottom: 1px solid #f0f0f0; margin-bottom: 0.5rem;
        }
        .sidebar-logo-mark {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, #185FA5 0%, #042C53 100%);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 13px;
        }
        .sidebar-logo-text { font-size: 14px; font-weight: 700; color: #042C53; }

        .sidebar-section {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
            color: #999; padding: 0.75rem 1.25rem 0.4rem; font-weight: 600;
        }
        .sidebar-section.admin-section { color: #c62828; }
        .sidebar-link {
            display: flex; align-items: center; gap: 8px;
            width: 100%; padding: 8px 1.25rem; background: none;
            border: none; color: #2C2C2A; text-align: left; cursor: pointer;
            font-size: 13px; font-family: inherit; transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover { background: #f5f5f5; }
        .sidebar-link.active { background: #E6F1FB; color: #185FA5; border-left-color: #185FA5; font-weight: 600; }
        .sidebar-link.admin-link.active { background: #fee; color: #c62828; border-left-color: #c62828; }
        .sidebar-icon { width: 16px; text-align: center; }

        .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        .main-content { flex: 1; overflow: auto; padding: 1.5rem 2rem; background: #f5f5f5; }

        .page-header { margin-bottom: 1.5rem; }
        .page-title { font-size: 22px; color: #042C53; margin-bottom: 0.25rem; font-weight: 700; }
        .page-subtitle { color: #666; font-size: 13px; }

        .card { background: white; padding: 1.25rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #e5e5e5; }
        .card-title { font-size: 14px; font-weight: 600; color: #042C53; margin-bottom: 0.5rem; }

        /* STATS */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem; margin-bottom: 1.5rem;
        }
        .stat-card { background: white; padding: 1rem 1.25rem; border-radius: 6px; border: 1px solid #e5e5e5; }
        .stat-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
            color: #888; font-weight: 600; margin-bottom: 0.4rem;
        }
        .stat-value { font-size: 26px; font-weight: 700; color: #042C53; line-height: 1.1; }
        .stat-meta { font-size: 11px; color: #999; margin-top: 0.4rem; }

        /* TABLES */
        .table-wrap { background: white; border-radius: 6px; border: 1px solid #e5e5e5; overflow: hidden; }
        .table-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 1rem; border-bottom: 1px solid #e5e5e5; background: #fafafa;
        }
        .table-header-info { font-size: 12px; color: #666; display: flex; align-items: center; gap: 8px; }
        .live-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #4caf50;
            display: inline-block; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 8px 12px; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.05em; color: #666;
            background: #fafafa; border-bottom: 1px solid #e5e5e5; font-weight: 600;
        }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 12px; vertical-align: top; }
        tr:hover td { background: #fafbfc; }
        .td-time { white-space: nowrap; color: #666; font-family: monospace; font-size: 11px; }
        .td-user { font-weight: 500; color: #042C53; }
        .td-detail { color: #555; line-height: 1.5; max-width: 400px; }
        .td-device { font-size: 11px; color: #999; white-space: nowrap; }

        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 3px;
            font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
        }
        .badge-default { background: #f0f0f0; color: #666; }
        .badge-info { background: #E6F1FB; color: #185FA5; }
        .badge-success { background: #e8f5e9; color: #2e7d32; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #ffebee; color: #c62828; }

        .filters-bar {
            background: white; padding: 1rem; border-radius: 6px; border: 1px solid #e5e5e5;
            margin-bottom: 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem; align-items: end;
        }
        .filter-group label {
            display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
            color: #888; font-weight: 600; margin-bottom: 4px;
        }
        .filter-group input, .filter-group select {
            width: 100%; padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 12px; font-family: inherit;
        }
        .filter-actions { display: flex; gap: 6px; align-items: end; }

        .pagination {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 1rem; border-top: 1px solid #e5e5e5; background: #fafafa;
            font-size: 12px; color: #666;
        }
        .pagination-controls { display: flex; gap: 6px; align-items: center; }
        .pagination button {
            padding: 4px 10px; background: white; border: 1px solid #ddd;
            border-radius: 3px; cursor: pointer; font-size: 12px; font-family: inherit;
        }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination button:hover:not(:disabled) { background: #f5f5f5; }

        .info-box { background: #E6F1FB; padding: 1rem; border-radius: 6px; border: 1px solid #85B7EB; margin-bottom: 1.5rem; }
        .info-box h3 { margin-bottom: 0.4rem; color: #042C53; font-size: 14px; }
        .info-box p { margin: 0; font-size: 12px; color: #185FA5; line-height: 1.6; }

        .topics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
        .topic-card {
            background: white; padding: 1.25rem; border-radius: 8px; border: 1px solid #e5e5e5;
            cursor: pointer; transition: all 0.15s; text-align: center;
        }
        .topic-card:hover { border-color: #185FA5; box-shadow: 0 4px 14px rgba(24, 95, 165, 0.1); transform: translateY(-2px); }
        .topic-card-emoji { font-size: 32px; margin-bottom: 0.5rem; }
        .topic-card-title { font-size: 14px; font-weight: 600; color: #042C53; margin-bottom: 4px; }
        .topic-card-meta { font-size: 11px; color: #999; }

        .empty-state { text-align: center; padding: 2rem; color: #999; font-size: 13px; }

        .logout-btn {
            padding: 6px 12px; background: white; border: 1px solid #c62828;
            color: #c62828; border-radius: 4px; cursor: pointer; font-size: 12px;
            font-family: inherit; font-weight: 600;
        }
        .logout-btn:hover { background: #c62828; color: white; }

        /* CONTENT EDITOR */
        .content-list-item {
            background: white; padding: 1rem; border-radius: 6px; border: 1px solid #e5e5e5;
            margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        }
        .content-list-info { flex: 1; min-width: 0; }
        .content-list-title { font-size: 14px; font-weight: 600; color: #042C53; margin-bottom: 2px; }
        .content-list-meta { font-size: 11px; color: #888; }
        .content-list-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-icon {
            padding: 5px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;
            border: 1px solid #ddd; background: white; font-family: inherit; font-weight: 500;
        }
        .btn-icon:hover { background: #f5f5f5; }
        .btn-icon-danger { color: #c62828; border-color: #f4c0c0; }
        .btn-icon-danger:hover { background: #fee; }

        /* TOPIC VIEWER */
        .topic-detail-header {
            display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
            padding-bottom: 1rem; border-bottom: 1px solid #e5e5e5;
        }
        .topic-detail-emoji { font-size: 48px; }
        .topic-detail-title { font-size: 28px; font-weight: 700; color: #042C53; }
        .content-block {
            background: white; padding: 1.5rem; border-radius: 8px;
            border: 1px solid #e5e5e5; margin-bottom: 1rem;
        }
        .content-block h3 {
            color: #042C53; font-size: 18px; margin-bottom: 0.75rem;
        }
        .content-block-body {
            font-size: 14px; line-height: 1.7; color: #444; white-space: pre-wrap;
        }
        .content-video-wrap {
            position: relative; padding-bottom: 56.25%; height: 0;
            margin: 1rem 0; border-radius: 8px; overflow: hidden;
        }
        .content-video-wrap iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        @media (max-width: 768px) {
            .hero { grid-template-columns: 1fr; padding: 2rem 1rem; gap: 2rem; }
            .hero-title { font-size: 36px; }
            .about-section { grid-template-columns: 1fr; padding: 2rem 1rem; }
            .app-shell { flex-direction: column; }
            .sidebar { width: 100%; }
            .main-content { padding: 1rem; }
        }
    </style>
</head>

    // ============= UTILS =============
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    function getDeviceInfo() {
        const ua = navigator.userAgent;
        const w = window.screen.width, h = window.screen.height;
        let icon = '🖥️', os = 'Web';
        if (/iPhone|iPad|iPod/i.test(ua)) { icon = '📱'; os = 'iOS'; }
        else if (/Android/i.test(ua)) { icon = '📱'; os = 'Android'; }
        else if (/Macintosh|Mac OS/i.test(ua)) { icon = '💻'; os = 'Mac'; }
        else if (/Windows/i.test(ua)) { icon = '🖥️'; os = 'Win'; }
        else if (/Linux/i.test(ua)) { icon = '🖥️'; os = 'Linux'; }
        return `${icon} ${os} ${w}x${h}`;
    }

    function formatDateTime(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        return `${d.toLocaleDateString('pt-BR')}, ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    }

    async function logAction(action, details) {
        if (!currentUser || !db) return;
        try {
            await db.from('admin_logs').insert([{
                admin_id: currentUser.id,
                action: action,
                details: details || {},
                device: getDeviceInfo(),
                user_email: currentUser.email,
                user_name: (currentProfile && currentProfile.full_name) || currentUser.email
            }]);
        } catch (err) {
            console.warn('Falha ao registrar log:', err);
        }
    }

    function getActionBadge(action) {
        const map = {
            'Login': 'badge-success', 'Logout': 'badge-default', 'Cadastro': 'badge-info',
            'Acesso Tópico': 'badge-info', 'Criar Anotação': 'badge-success',
            'Editar Perfil': 'badge-warning', 'Acesso Admin': 'badge-warning',
            'Criar Conteúdo': 'badge-success', 'Editar Conteúdo': 'badge-warning',
            'Excluir Conteúdo': 'badge-danger'
        };
        return map[action] || 'badge-default';
    }

    function isAdmin() { return currentRole === 'admin'; }

    function getTopicData(name) {
        return TOPICS.find(t => t.name === name) || { name, emoji: '📄', color: '#888' };
    }

    function extractYoutubeEmbed(url) {
        if (!url) return null;
        // Já é embed
        if (url.includes('/embed/')) return url;
        // youtube.com/watch?v=ID
        const watchMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
        if (watchMatch) return `https://www.youtube.com/embed/${watchMatch[1]}`;
        return url;
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'Entrando...';

        try {
            const result = await db.auth.signInWithPassword({ email, password });
            if (result.error) throw result.error;

            currentUser = result.data.user;
            const profileResult = await db.from('profiles').select('*').eq('id', currentUser.id).single();
            currentProfile = profileResult.data;
            currentRole = (currentProfile && currentProfile.role) ? currentProfile.role : 'user';

            await logAction('Login', { method: 'email/password' });
            currentPage = 'topicos';
            renderShell();
        } catch (err) {
            renderLogin('❌ ' + err.message);
        }
    }

    async function handleSignup(e) {
        e.preventDefault();
        const fullName = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const btn = document.getElementById('signupBtn');
        btn.disabled = true;
        btn.textContent = 'Criando conta...';

        try {
            const result = await db.auth.signUp({
                email, password,
                options: {
                    data: { full_name: fullName },
                    emailRedirectTo: window.location.href
                }
            });
            if (result.error) throw result.error;
            renderSignup('✅ Conta criada! Verifique seu email para confirmar (ou tente fazer login direto).');
        } catch (err) {
            renderSignup('❌ ' + err.message);
        }
    }

    async function handleLogout() {
        await logAction('Logout', {});
        await db.auth.signOut();
        currentUser = null;
        currentRole = null;
        currentProfile = null;
        renderLanding();
    }

    // ============= SHELL =============
    function renderShell() {
        const adminMode = ['analise', 'logs', 'usuarios', 'admin-anotacoes', 'conteudo-admin', 'config', 'seguranca'].includes(currentPage);

        document.getElementById('app').innerHTML = `
            <div class="app-shell">
                <div class="sidebar" id="sidebar"></div>
                <div class="main-area">
                    <div class="top-bar">
                        <div class="top-bar-left">
                            <span class="top-bar-badge ${adminMode ? 'admin' : ''}">${adminMode ? 'ADMIN' : 'PLATAFORMA'}</span>
                            <span class="top-bar-title">${adminMode ? 'Painel Administrativo' : 'Nora e Vaso'}</span>
                        </div>
                        <div class="top-bar-right">
                            <span class="top-bar-user">
                                <strong>${escapeHtml((currentProfile && currentProfile.full_name) || currentUser.email)}</strong>
                                ${isAdmin() ? '<span class="role-pill">Admin</span>' : ''}
                            </span>
                            <button class="logout-btn" onclick="handleLogout()">Sair</button>
                        </div>
                    </div>
                    <div class="main-content" id="content"></div>
                </div>
            </div>
        `;
        renderSidebar();
        renderPage();
    }

    function changePage(page) {
        currentPage = page;
        currentTopicViewing = null;
        editingContentId = null;
        logPage = 1;
        renderShell();
    }

    async function renderPage() {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="empty-state">Carregando...</div>';

        if (currentPage === 'topicos') {
            if (currentTopicViewing) await renderTopicDetail(content);
            else await renderTopicos(content);
        }
        else if (currentPage === 'anotacoes') await renderMinhasAnotacoes(content);
        else if (currentPage === 'analise') await renderAnalise(content);
        else if (currentPage === 'logs') await renderLogs(content);
        else if (currentPage === 'usuarios') await renderUsuarios(content);
        else if (currentPage === 'admin-anotacoes') await renderTodasAnotacoes(content);
        else if (currentPage === 'conteudo-admin') await renderConteudoAdmin(content);
        else if (currentPage === 'config') await renderConfig(content);
        else if (currentPage === 'seguranca') await renderSeguranca(content);
    }

    async function openTopic(name) {
        if (!hasAccess()) { showPaywall(); return; }
        currentTopicViewing = name;
        await logAction('Acesso Tópico', { topic: name });
        renderPage();
    }

    async function renderTopicDetail(content) {
        const topic = getTopicData(currentTopicViewing);
        const result = await db.from('content').select('*').eq('topic', currentTopicViewing).order('order_index', { ascending: true });
        const items = result.data || [];

        const itemsHtml = items.map(item => {
            const videoEmbed = item.video_url ? extractYoutubeEmbed(item.video_url) : null;
            const videoHtml = videoEmbed
                ? `<div class="content-video-wrap"><iframe src="${escapeHtml(videoEmbed)}" allowfullscreen></iframe></div>`
                : '';
            return `
                <div class="content-block">
                    <h3>${escapeHtml(item.title)}</h3>
                    ${videoHtml}
                    <div class="content-block-body">${escapeHtml(item.body || '')}</div>
                </div>
            `;
        }).join('');

        content.innerHTML = `
            <button class="auth-back" onclick="closeTopic()">← Voltar para tópicos</button>
            <div class="topic-detail-header">
                <div class="topic-detail-emoji">${topic.emoji}</div>
                <div>
                    <div class="topic-detail-title">${topic.name}</div>
                    <div style="color: #666; font-size: 13px;">${items.length} ${items.length === 1 ? 'material' : 'materiais'}</div>
                </div>
            </div>
            ${items.length > 0 ? itemsHtml : '<div class="empty-state">Nenhum material publicado neste tópico ainda.</div>'}
        `;
    }

    function closeTopic() {
        currentTopicViewing = null;
        renderPage();
    }

    // ============= USER: ANOTAÇÕES =============
    async function renderMinhasAnotacoes(content) {
        const reportsResult = await db.from('reports').select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });
        const reports = reportsResult.data || [];

        const reportsHtml = reports.map(r => `
            <div class="card">
                <div class="card-title">${escapeHtml(r.title)}</div>
                <div style="color: #555; font-size: 13px; margin-bottom: 6px; white-space: pre-wrap;">${escapeHtml(r.content)}</div>
                <div style="font-size: 11px; color: #999;">${formatDateTime(r.created_at)}</div>
            </div>
        `).join('');

        content.innerHTML = `
            <div class="page-header">
                <h1 class="page-title">📝 Minhas anotações</h1>
                <p class="page-subtitle">Suas anotações pessoais sobre os tópicos</p>
            </div>
            <form id="reportForm" class="card" style="margin-bottom: 1.5rem;">
                <div class="form-group">
                    <label>Adicionar anotação</label>
                    <textarea id="newReport" placeholder="Escreva sua anotação..." style="min-height: 80px;" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" id="saveReportBtn">Salvar anotação</button>
            </form>
            ${reportsHtml.length > 0 ? reportsHtml : '<div class="empty-state">Nenhuma anotação ainda</div>'}
        `;
        document.getElementById('reportForm').addEventListener('submit', handleAddReport);
    }

    async function handleAddReport(e) {
        e.preventDefault();
        const ctn = document.getElementById('newReport').value;
        const btn = document.getElementById('saveReportBtn');
        btn.disabled = true;
        btn.textContent = 'Salvando...';

        try {
            const result = await db.from('reports').insert([{
                user_id: currentUser.id,
                title: 'Anotação',
                content: ctn,
                topic: 'geral'
            }]);
            if (result.error) throw result.error;

    // ============= ADMIN: LOGS =============
    async function renderLogs(content) {
        await logAction('Acesso Admin', { page: 'logs' });

        let query = db.from('admin_logs').select('*', { count: 'exact' });
        if (logFilters.dateFrom) query = query.gte('created_at', logFilters.dateFrom + 'T00:00:00');
        if (logFilters.dateTo) query = query.lte('created_at', logFilters.dateTo + 'T23:59:59');
        if (logFilters.actionType) query = query.eq('action', logFilters.actionType);
        if (logFilters.userQuery) query = query.or(`user_name.ilike.%${logFilters.userQuery}%,user_email.ilike.%${logFilters.userQuery}%`);

        const from = (logPage - 1) * LOGS_PER_PAGE;
        const to = from + LOGS_PER_PAGE - 1;

        const result = await query.order('created_at', { ascending: false }).range(from, to);
        const logs = result.data || [];
        const total = result.count || 0;
        const totalPages = Math.max(1, Math.ceil(total / LOGS_PER_PAGE));

        const logsHtml = logs.map(l => {
            let detailStr = '';
            if (l.details && typeof l.details === 'object') {
                const entries = Object.entries(l.details);
                detailStr = entries.map(([k, v]) => `<strong>${escapeHtml(k)}:</strong> ${escapeHtml(v)}`).join(' · ');
            }
            return `
                <tr>
                    <td class="td-time">${formatDateTime(l.created_at)}</td>
                    <td class="td-user">${escapeHtml(l.user_name || l.user_email || '—')}</td>
                    <td><span class="badge ${getActionBadge(l.action)}">${escapeHtml(l.action)}</span></td>
                    <td class="td-detail">${detailStr || '—'}</td>
                    <td class="td-device">${escapeHtml(l.device || '—')}</td>
                </tr>
            `;
        }).join('');

        content.innerHTML = `
            <div class="page-header">
                <h1 class="page-title">🔍 Log de Auditoria</h1>
                <p class="page-subtitle">Registro de acessos e ações</p>
            </div>
            <div class="filters-bar">
                <div class="filter-group">
                    <label>De</label>
                    <input type="date" id="filterDateFrom" value="${logFilters.dateFrom}">
                </div>
                <div class="filter-group">
                    <label>Até</label>
                    <input type="date" id="filterDateTo" value="${logFilters.dateTo}">
                </div>
                <div class="filter-group">
                    <label>Usuário</label>
                    <input type="text" id="filterUser" placeholder="Nome ou email" value="${logFilters.userQuery}">
                </div>
                <div class="filter-group">
                    <label>Ação</label>
                    <select id="filterAction">
                        <option value="">Todas</option>
                        ${['Login','Logout','Cadastro','Acesso Tópico','Criar Anotação','Editar Perfil','Acesso Admin','Criar Conteúdo','Editar Conteúdo','Excluir Conteúdo'].map(a =>
                            `<option ${logFilters.actionType === a ? 'selected' : ''}>${a}</option>`).join('')}
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="applyLogFilters()">Filtrar</button>
                    <button class="btn btn-secondary" onclick="clearLogFilters()">Limpar</button>
                </div>
            </div>
            <div class="table-wrap">
                <div class="table-header">
                    <div class="table-header-info">
                        <span class="live-dot"></span>
                        <span>ao vivo · <strong>${total}</strong> ${total === 1 ? 'registro' : 'registros'}</span>
                    </div>
                    <button class="btn btn-secondary" onclick="renderPage()">↺ Atualizar</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th style="width:160px">Data/Hora</th>
                            <th style="width:160px">Usuário</th>
                            <th style="width:130px">Ação</th>
                            <th>Detalhe</th>
                            <th style="width:140px">Dispositivo</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${logsHtml || '<tr><td colspan="5" class="empty-state">Nenhum registro encontrado</td></tr>'}
                    </tbody>
                </table>
                <div class="pagination">
                    <span>Página <strong>${logPage}</strong> de <strong>${totalPages}</strong></span>
                    <div class="pagination-controls">
                        <button onclick="changeLogPage(${logPage - 1})" ${logPage <= 1 ? 'disabled' : ''}>← Anterior</button>
                        <button onclick="changeLogPage(${logPage + 1})" ${logPage >= totalPages ? 'disabled' : ''}>Próxima →</button>
                    </div>
                </div>
            </div>
        `;
    }

        logFilters = { dateFrom: '', dateTo: '', userQuery: '', actionType: '' };

    function renderContentEditor(topic, existing) {
        const t = getTopicData(topic);
        const contentDiv = document.getElementById('content');
        contentDiv.innerHTML = `
            <button class="auth-back" onclick="changePage('conteudo-admin')">← Voltar</button>
            <div class="page-header">
                <h1 class="page-title">${t.emoji} ${existing ? 'Editar' : 'Novo'} material — ${t.name}</h1>
                <p class="page-subtitle">${existing ? 'Editando material existente' : 'Adicione um novo material a esse tópico'}</p>
            </div>
            <form id="contentForm" class="card">
                <div class="form-group">
                    <label>Título do material</label>
                    <input type="text" id="cTitle" placeholder="Ex: Manejo do choque séptico" value="${existing ? escapeHtml(existing.title) : ''}" required>
                </div>
                <div class="form-group">
                    <label>Vídeo do YouTube (opcional)</label>
                    <input type="text" id="cVideo" placeholder="https://www.youtube.com/watch?v=..." value="${existing ? escapeHtml(existing.video_url || '') : ''}">
                    <div style="font-size:11px;color:#888;margin-top:4px;">Cole o link normal do YouTube — a plataforma converte automaticamente</div>
                </div>
                <div class="form-group">
                    <label>Conteúdo / texto explicativo</label>
                    <textarea id="cBody" placeholder="Escreva o conteúdo educacional..." style="min-height:280px;font-family:inherit;">${existing ? escapeHtml(existing.body || '') : ''}</textarea>
                </div>
                <div class="form-group">
                    <label>Ordem de exibição (opcional)</label>
                    <input type="number" id="cOrder" placeholder="0" value="${existing ? existing.order_index : 0}">
                </div>
                <div style="display:flex;gap:8px;margin-top:1rem;">
                    <button type="submit" class="btn btn-primary" id="cSave">${existing ? 'Salvar alterações' : 'Publicar material'}</button>
                    <button type="button" class="btn btn-secondary" onclick="changePage('conteudo-admin')">Cancelar</button>
                </div>
            </form>
        `;

        document.getElementById('contentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('cSave');
            btn.disabled = true;
            btn.textContent = 'Salvando...';

            const payload = {
                topic: topic,
                title: document.getElementById('cTitle').value,
                body: document.getElementById('cBody').value,
                video_url: document.getElementById('cVideo').value || null,
                order_index: parseInt(document.getElementById('cOrder').value) || 0,
                updated_at: new Date().toISOString()
            };

            try {
                let result;
                if (existing) {
                    result = await db.from('content').update(payload).eq('id', existing.id);
                    await logAction('Editar Conteúdo', { topic, title: payload.title });
                } else {
                    payload.created_by = currentUser.id;
                    result = await db.from('content').insert([payload]);
                    await logAction('Criar Conteúdo', { topic, title: payload.title });
                }
                if (result.error) throw result.error;
                changePage('conteudo-admin');
            } catch (err) {
                alert('Erro: ' + err.message);
                btn.disabled = false;
                btn.textContent = existing ? 'Salvar alterações' : 'Publicar material';
            }
        });
    }

    async function deleteContent(id) {
        if (!confirm('Tem certeza que deseja excluir este material? Essa ação não pode ser desfeita.')) return;
        try {
            const item = await db.from('content').select('topic, title').eq('id', id).single();
            const result = await db.from('content').delete().eq('id', id);
            if (result.error) throw result.error;
            if (item.data) await logAction('Excluir Conteúdo', { topic: item.data.topic, title: item.data.title });
            renderPage();
        } catch (err) {
            alert('Erro ao excluir: ' + err.message);
        }
    }

            document.getElementById('app').innerHTML = `
                <div class="auth-container">
                    <div class="alert alert-error">❌ Erro ao carregar Supabase. Verifique sua conexão.</div>
                </div>
            `;
            return;
        }

        try {
            const sessionResult = await db.auth.getSession();
            const session = sessionResult.data.session;

            if (session && session.user) {
                currentUser = session.user;
                const profileResult = await db.from('profiles').select('*').eq('id', session.user.id).single();
                currentProfile = profileResult.data;
                currentRole = (currentProfile && currentProfile.role) ? currentProfile.role : 'user';
                currentPage = 'topicos';
                renderShell();
            } else {
                renderLanding();
            }
        } catch (err) {
            console.error('Erro:', err);
            renderLanding();
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
